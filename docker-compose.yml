services:
  postgres:
    image: postgres:17
    container_name: kindraise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: KindRaiseDb
    ports:
      - "5432:5432"
    volumes:
      - kindraise-postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: kindraise-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - kindraise-rabbitmq-data:/var/lib/rabbitmq

volumes:
  kindraise-postgres-data:
  kindraise-rabbitmq-data: